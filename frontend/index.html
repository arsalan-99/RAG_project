<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <span class="nav-brand">RAG Demo</span>
        <a href="index.html" class="active">Chat</a>
        <a href="files.html">Files</a>
        <a href="admin.html">Admin</a>
    </nav>

    <div class="page">
        <div class="container">
            <div>
                <h1 class="page-title">Ask a Question</h1>
                <p class="page-sub">Query your uploaded documents using the RAG pipeline.</p>
            </div>

            <div class="card">
                <div class="card-label">Upload a Document</div>
                <input type="file" id="fileInput" accept=".pdf,.txt" />
                <button onclick="uploadFile()" style="margin-top: 12px;">Upload</button>
                <p class="status" id="uploadStatus"></p>
            </div>

            <div class="card">
                <div class="card-label">Ask</div>
                <div class="ask-row">
                    <input type="text" id="question" placeholder="Type your question..." onkeydown="if(event.key==='Enter') askQuestion()" />
                    <button onclick="askQuestion()">Ask</button>
                </div>
                <div id="answer"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
